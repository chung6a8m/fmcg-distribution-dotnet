# Keep patch-level updates reviewable for a solo developer. No auto-merge.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    groups:
      nuget-patches:
        update-types: ["patch"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    groups:
      npm-patches:
        update-types: ["patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    groups:
      actions-patches:
        update-types: ["patch"]

name: APP-02B.5 authorization and revocation (CI-only)
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  classify:
    name: doc-ci-b5-classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      receipt: ${{ steps.route.outputs.receipt }}
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify and verify this workflow's source and light checks
        id: route
        uses: ./.github/actions/doc-ci-classify

  run-b5-source:
    name: doc-ci-b5-run-b5-source
    needs: [classify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'
      - name: Build B5 core and boundary tests without enabling business routes
        run: |
          test "$(dotnet --version)" = "10.0.404"
          dotnet restore tests/FmcgDms.Preprod.Authorization.Tests/FmcgDms.Preprod.Authorization.Tests.csproj
          dotnet build tests/FmcgDms.Preprod.Authorization.Tests/FmcgDms.Preprod.Authorization.Tests.csproj -c Release --no-restore
          dotnet build src/FmcgDms.Preprod.Api/FmcgDms.Preprod.Api.csproj -c Release
          dotnet build src/FmcgDms.Preprod.Worker/FmcgDms.Preprod.Worker.csproj -c Release
          dotnet test tests/FmcgDms.Preprod.Authorization.Tests/FmcgDms.Preprod.Authorization.Tests.csproj -c Release --no-build -- --report-trx
      - name: Record CI-only source provenance
        if: always()
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p TestResults
          printf 'TestRunId=app02b5-unit-%s-%s\nSourceHeadSha=%s\nWorkflowSha=%s\nScope=GITHUB_HOSTED_CI_ONLY\nRealPreprod=NOT_VERIFIED\nG-B01..05=NOT_RUN\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_HEAD" "$GITHUB_SHA" > TestResults/APP-02B5-UNIT.txt
      - name: Upload source-only test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app02b5-source-ci-only
          path: |
            TestResults/
            tests/FmcgDms.Preprod.Authorization.Tests/TestResults/
          if-no-files-found: warn

  run-b5-two-tenant-sql:
    name: doc-ci-b5-run-b5-two-tenant-sql
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'docs-only') }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'
      - name: Verify local-only disposable Windows SQL Server
        id: localdb
        shell: pwsh
        env:
          CI_LOCALDB_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((dotnet --version).Trim() -ne '10.0.404') { throw 'SDK mismatch' }
          ./scripts/Initialize-LocalDb.ps1
      - name: Collect redacted LocalDB startup failure diagnostics
        if: always() && steps.localdb.outcome == 'failure'
        timeout-minutes: 1
        shell: pwsh
        env:
          LAB_E02_BOOTSTRAP: ${{ steps.localdb.outputs.bootstrap }}
          CI_LOCALDB_BOOTSTRAP_RECEIPT: ${{ steps.localdb.outputs.receipt }}
          LAB_E02_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/Collect-LocalDbDiagnostics.ps1
      - name: Build and execute two-tenant B5 SQL fault matrix
        shell: pwsh
        env:
          APP02B5_SQL_SERVER: '(localdb)\MSSQLLocalDB'
          APP02B5_TEST_RUN_ID: b5-sql-${{ github.run_id }}-${{ github.run_attempt }}
          APP02B5_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The same test assembly now includes issue #53's B53 SQL matrix.
          # Keep source-bound evidence required in this existing B5 workflow.
          APP02B53_TEST_RUN_ID: b53-b5-${{ github.run_id }}-${{ github.run_attempt }}
          APP02B53_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dotnet restore tests/FmcgDms.Preprod.Authorization.SqlServer.Tests/FmcgDms.Preprod.Authorization.SqlServer.Tests.csproj
          dotnet build tests/FmcgDms.Preprod.Authorization.SqlServer.Tests/FmcgDms.Preprod.Authorization.SqlServer.Tests.csproj -c Release --no-restore
          dotnet test tests/FmcgDms.Preprod.Authorization.SqlServer.Tests/FmcgDms.Preprod.Authorization.SqlServer.Tests.csproj -c Release --no-build -- --report-trx
      - name: Require source-bound independent SQL witness
        shell: pwsh
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $all = @(Get-ChildItem -Path . -Recurse -File -Filter APP-02B5-SQL-WITNESS.json)
          if ($all.Count -ne 1) { throw 'Missing or ambiguous B5 SQL witness' }
          $e = Get-Content -Raw $all[0].FullName | ConvertFrom-Json
          if ($e.SourceHeadSha -cne $env:SOURCE_HEAD -or
              $e.SchemaVersion -cne 'B5_20261118_001' -or
              $e.EvidenceClass -cne 'GITHUB_HOSTED_LOCALDB_ONLY' -or
              $e.PhysicalTenantDatabases -ne 2 -or
              !$e.IndependentFenceDatabase -or !$e.DifferentDatabaseIds -or
              !$e.CrossTenantDenied -or !$e.WrongBindingDenied -or
              !$e.ValidAContextWrongPhysicalTargetDenied -or
              !$e.RuntimeDirectPeerWriteDenied -or !$e.RegistryDatabaseMismatchDenied -or
              [string]::IsNullOrWhiteSpace($e.TenantSqlHashBefore) -or
              $e.TenantSqlHashBefore -cne $e.TenantSqlHashAfter -or
              [string]::IsNullOrWhiteSpace($e.PeerSqlHashBefore) -or
              $e.PeerSqlHashBefore -cne $e.PeerSqlHashAfter -or
              !$e.MakerCheckerDenied -or !$e.SessionUnavailableDenied -or
              !$e.RuntimeDirectSqlReadDenied -or !$e.RevokeWaitedForProtectedCommit -or
              !$e.StaleAuthorityDenied -or !$e.SuspendedTenantDenied -or
              $e.TenantAEffects -ne 2 -or $e.PeerTenantEffects -ne 0 -or
              $e.RealPreprod -cne 'NOT_VERIFIED' -or $e.GB01ToGB05 -cne 'NOT_RUN') {
            throw 'B5 SQL witness missing mandatory assertions'
          }
          $controlFiles = @(Get-ChildItem -Path . -Recurse -File -Filter APP-02B5-CONTROL-RACES.json)
          if ($controlFiles.Count -ne 1) { throw 'Missing/ambiguous B3/B4 commit race evidence' }
          $c = Get-Content -Raw $controlFiles[0].FullName | ConvertFrom-Json
          if ($c.SourceHeadSha -cne $env:SOURCE_HEAD -or
              !$c.ActualB3SqlSessionRevokeSerialized -or
              !$c.ActualB4TransitionSerialized -or
              !$c.StaleJwtAndRegistryEpochDenied -or
              $c.PeerTenantEffects -ne 0 -or
              $c.RestoreResurrectionProof -cne 'NOT_VERIFIED' -or
              $c.RealPreprod -cne 'NOT_VERIFIED') {
            throw 'B3/B4 current authority SQL race witness mismatch'
          }
          $approvalFiles = @(Get-ChildItem -Path . -Recurse -File -Filter APP-02B5-APPROVAL.json)
          if ($approvalFiles.Count -ne 1) { throw 'Missing B5 approval SQL witness' }
          $a = Get-Content -Raw $approvalFiles[0].FullName | ConvertFrom-Json
          if ($a.SourceHeadSha -cne $env:SOURCE_HEAD -or
              !$a.ActionCatalogRequired -or !$a.MissingSourceDenied -or
              !$a.ForgedSourceDenied -or !$a.SelfMakerDenied -or
              !$a.CheckerInitiatorDenied -or !$a.WrongResourceDenied -or
              !$a.ApprovalRollbackAtomic -or !$a.SourceImmutable -or
              !$a.DecisionImmutable -or !$a.ApprovalReplayDenied -or
              $a.DecisionCommitCount -ne 1 -or
              [string]::IsNullOrWhiteSpace($a.PeerHashBefore) -or
              $a.PeerHashBefore -cne $a.PeerHashAfter -or
              $a.RealPreprod -cne 'NOT_VERIFIED') {
            throw 'B5 approval SQL witness mismatch'
          }

          $b53Files = @(Get-ChildItem -Path . -Recurse -File -Filter APP-02B53-LOCALDB.json)
          if ($b53Files.Count -ne 1) { throw 'New B53 LocalDB matrix did not run or witness ambiguous' }
          $b53 = Get-Content -Raw $b53Files[0].FullName | ConvertFrom-Json
          if ($b53.SourceHeadSha -cne $env:SOURCE_HEAD -or
              $b53.EvidenceClass -cne 'GITHUB_HOSTED_LOCALDB_ONLY' -or
              !$b53.SessionRevokeSameCommit -or !$b53.TenantSuspendSameCommit -or
              !$b53.IndependentActivationSelfApprovalDenied -or !$b53.ExpiredPermitReapprovalSucceeded -or
              !$b53.DeniedB3OnlyCommitOnFencePrivilegeLoss -or
              !$b53.RestoredOldSessionJwtDenied -or !$b53.RestoredOldRegistryEpochDenied -or
              !$b53.DisabledB3B4BridgesDenied -or
              $b53.PeerSqlHashBefore -cne $b53.PeerSqlHashAfter -or
              !$b53.SimulatedOldSnapshotOnly -or
              $b53.RealPhysicalPitr -cne 'NOT_VERIFIED' -or
              $b53.RuntimeActivation -cne 'NO_GO' -or
              $b53.GB01ToGB05 -cne 'NOT_RUN') {
            throw 'B53 source evidence cannot be promoted by B5 regression workflow'
          }
          $schemaFiles = @(Get-ChildItem -Path . -Recurse -File -Filter APP-02B5-SCHEMA-INTEGRITY.json)
          if ($schemaFiles.Count -ne 1) { throw 'Missing B5 schema replay witness' }
          $s = Get-Content -Raw $schemaFiles[0].FullName | ConvertFrom-Json
          if ($s.SourceHeadSha -cne $env:SOURCE_HEAD -or
              !$s.FenceHistoryTamperDenied -or !$s.IdentityHistoryTamperDenied -or
              !$s.RegistryHistoryTamperDenied -or
              $s.RealPreprod -cne 'NOT_VERIFIED') {
            throw 'B5 schema history accepted corrupted migration objects'
          }
          New-Item -ItemType Directory -Force TestResults | Out-Null
          Copy-Item $all[0].FullName TestResults/APP-02B5-SQL-WITNESS.json
          Copy-Item $controlFiles[0].FullName TestResults/APP-02B5-CONTROL-RACES.json
          Copy-Item $approvalFiles[0].FullName TestResults/APP-02B5-APPROVAL.json
          Copy-Item $schemaFiles[0].FullName TestResults/APP-02B5-SCHEMA-INTEGRITY.json
          Copy-Item $b53Files[0].FullName TestResults/APP-02B53-LOCALDB.json
          $identityHash=(Get-FileHash src/FmcgDms.Preprod.Authorization/Migrations/20261118_002_identity_guard.sql -Algorithm SHA256).Hash
          $registryHash=(Get-FileHash src/FmcgDms.Preprod.Authorization/Migrations/20261118_003_registry_guard.sql -Algorithm SHA256).Hash
          $hash=(Get-FileHash src/FmcgDms.Preprod.Authorization/Migrations/20261118_001_independent_fence.sql -Algorithm SHA256).Hash
          @("TestRunId=$($e.TestRunId)","SourceHeadSha=$env:SOURCE_HEAD",
            "WorkflowSha=$env:GITHUB_SHA","MigrationSha256=$hash",
            "IdentityGuardMigrationSha256=$identityHash",
            "RegistryGuardMigrationSha256=$registryHash",
            "Scope=GITHUB_HOSTED_LOCALDB_NOT_PHYSICAL_PREPROD",
            "G-B01..05=NOT_RUN") | Set-Content TestResults/APP-02B5-SQL-PROVENANCE.txt -Encoding utf8
      - name: Upload LocalDB evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app02b5-two-tenant-sql-ci-only
          path: |
            TestResults/APP-02B5-SQL-WITNESS.json
            TestResults/APP-02B5-CONTROL-RACES.json
            TestResults/APP-02B5-APPROVAL.json
            TestResults/APP-02B5-SCHEMA-INTEGRITY.json
            TestResults/APP-02B53-LOCALDB.json
            TestResults/APP-02B5-SQL-PROVENANCE.txt
            tests/FmcgDms.Preprod.Authorization.SqlServer.Tests/TestResults/
            TestResults/LocalDbBootstrap/
            TestResults/LAB-E02/
          if-no-files-found: warn

  b5-source:
    name: b5-source
    needs: [classify, run-b5-source, run-b5-two-tenant-sql]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the tested integration tree
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact companion classification and job outcomes
        env:
          DOC_CI_COMPANION: app02b5-authorization.yml
          DOC_CI_NEEDS_JSON: ${{ toJSON(needs) }}
          APP00A_EVENT_NAME: ${{ github.event_name }}
          APP00A_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          APP00A_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP00A_WORKFLOW_SHA: ${{ github.sha }}
        run: python3 -B tools/verify_doc_ci_companions.py

  b5-two-tenant-sql:
    name: b5-two-tenant-sql
    needs: [classify, run-b5-source, run-b5-two-tenant-sql]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the tested integration tree
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact companion classification and job outcomes
        env:
          DOC_CI_COMPANION: app02b5-authorization.yml
          DOC_CI_NEEDS_JSON: ${{ toJSON(needs) }}
          APP00A_EVENT_NAME: ${{ github.event_name }}
          APP00A_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          APP00A_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP00A_WORKFLOW_SHA: ${{ github.sha }}
        run: python3 -B tools/verify_doc_ci_companions.py

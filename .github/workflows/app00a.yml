name: APP-00A foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable business contract
        shell: pwsh
        run: |
          ./scripts/Verify-Business.ps1
          python tools/validate_business.py
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb info MSSQLLocalDB
          sqllocaldb start MSSQLLocalDB
          sqlcmd -S '(localdb)\MSSQLLocalDB' -E -Q 'SELECT @@VERSION AS Version'
      - name: .NET restore
        run: dotnet restore FmcgDms.slnx
      - name: Build .NET solution
        run: dotnet build FmcgDms.slnx -c Release --no-restore
      - name: Two-tenant scratch integration tests
        env:
          APP00A_SQL_SERVER: '(localdb)\MSSQLLocalDB'
        run: dotnet test FmcgDms.slnx -c Release --no-build --logger trx
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Capture deterministic dependency lock (temporary)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('web/package-lock.json')
          $encoded = [Convert]::ToBase64String($bytes)
          $chunkSize = 4096
          for ($i = 0; $i -lt $encoded.Length; $i += $chunkSize) {
            $count = [Math]::Min($chunkSize, $encoded.Length - $i)
            $part = $encoded.Substring($i, $count)
            Write-Host ("NPMLOCKPART:{0:D4}:{1}" -f [int]($i / $chunkSize), $part)
          }
      - name: Build online-first React PWA
        working-directory: web
        run: npm run build
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app00a-test-evidence
          path: '**/TestResults/**/*.trx'
          if-no-files-found: warn

name: APP-00A foundation
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  core_sql:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use runner temporary NuGet package directory
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'app00a-nuget-packages'
          "NUGET_PACKAGES=$packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'
      - name: Verify pinned SDK
        shell: pwsh
        run: |
          $actual = (dotnet --version).Trim()
          if ($actual -ne '10.0.404') { throw "Expected SDK 10.0.404, got $actual" }
      - name: Validate immutable business contract
        shell: pwsh
        run: |
          ./scripts/Verify-Business.ps1
          python tools/validate_business.py
          python tools/validate_e_sim_01.py
      - name: Verify deterministic LocalDB bootstrap regressions
        shell: pwsh
        run: pwsh -NoProfile -File tests/ci/Test-LocalDbBootstrap.ps1
      - name: Verify same-job Demo build reuse regressions
        shell: pwsh
        run: pwsh -NoProfile -File tests/ci/Test-CiPrebuiltDemo.ps1
      - name: Start SQL Server LocalDB
        id: localdb
        shell: pwsh
        env:
          CI_LOCALDB_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/Initialize-LocalDb.ps1
      - name: Verify warm SQL Server LocalDB bootstrap
        id: localdb_warm
        if: steps.localdb.outcome == 'success'
        shell: pwsh
        env:
          CI_LOCALDB_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/Initialize-LocalDb.ps1 -RequireWarm
      - name: Collect redacted LocalDB startup failure diagnostics
        if: always() && (steps.localdb.outcome == 'failure' || steps.localdb_warm.outcome == 'failure')
        timeout-minutes: 1
        shell: pwsh
        env:
          LAB_E02_BOOTSTRAP: ${{ steps.localdb_warm.outputs.bootstrap || steps.localdb.outputs.bootstrap }}
          CI_LOCALDB_BOOTSTRAP_RECEIPT: ${{ steps.localdb_warm.outputs.receipt || steps.localdb.outputs.receipt }}
          LAB_E02_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/Collect-LocalDbDiagnostics.ps1
      - name: .NET restore
        run: dotnet restore FmcgDms.slnx
      - name: Build .NET solution
        run: dotnet build FmcgDms.slnx -c Release --no-restore
      - name: Two-tenant LocalDB A11-01..12 independent SQL oracle + APP-01E.5/AC-03 regressions
        env:
          APP00A_SQL_SERVER: '(localdb)\MSSQLLocalDB'
          APP01B3_TEST_RUN_ID: app01b3-${{ github.run_id }}-${{ github.run_attempt }}
          APP01B3_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01C1_TEST_RUN_ID: app01c1-${{ github.run_id }}-${{ github.run_attempt }}
          APP01C1_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01C2_TEST_RUN_ID: app01c2-${{ github.run_id }}-${{ github.run_attempt }}
          APP01C2_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01C3_TEST_RUN_ID: app01c3-${{ github.run_id }}-${{ github.run_attempt }}
          APP01C3_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01C4_TEST_RUN_ID: app01c4-${{ github.run_id }}-${{ github.run_attempt }}
          APP01C4_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01D_TEST_RUN_ID: app01d-${{ github.run_id }}-${{ github.run_attempt }}
          APP01D_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01E1_TEST_RUN_ID: app01e1-${{ github.run_id }}-${{ github.run_attempt }}
          APP01E1_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01E2_TEST_RUN_ID: app01e2-${{ github.run_id }}-${{ github.run_attempt }}
          APP01E2_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01E3_TEST_RUN_ID: app01e3-${{ github.run_id }}-${{ github.run_attempt }}
          APP01E3_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01E4_TEST_RUN_ID: app01e4-${{ github.run_id }}-${{ github.run_attempt }}
          APP01E4_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP01E5_TEST_RUN_ID: app01e5-${{ github.run_id }}-${{ github.run_attempt }}
          APP01E5_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP02A2_TEST_RUN_ID: app02a2-${{ github.run_id }}-${{ github.run_attempt }}
          APP02A2_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP02A3_TEST_RUN_ID: app02a3-${{ github.run_id }}-${{ github.run_attempt }}
          APP02A3_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP02A4_TEST_RUN_ID: app02a4-${{ github.run_id }}-${{ github.run_attempt }}
          APP02A4_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: dotnet test --solution FmcgDms.slnx -c Release --no-build --minimum-expected-tests 317 -- --report-trx --coverage --coverage-output-format cobertura
      - name: Record reproducible APP-01B.3 TestRunId and PR head
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01b3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          # A pull_request workflow runs on a synthetic merge commit; record
          # the actual reviewed source HEAD separately from GitHub's merge SHA.
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          "TestRunId=$id`nSourceHeadSha=$sourceHead`nWorkflowSha=$env:GITHUB_SHA`nRunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" |
            Set-Content -Path TestResults/APP-01B3-TestRunId.txt -Encoding utf8
          Write-Host "APP-01B.3 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01C.1 schema TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01c1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          "TestRunId=$id`nSourceHeadSha=$sourceHead`nWorkflowSha=$env:GITHUB_SHA`nRunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" |
            Set-Content -Path TestResults/APP-01C1-TestRunId.txt -Encoding utf8
          Write-Host "APP-01C.1 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01C.2 B20 TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01c2-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          "TestRunId=$id`nSourceHeadSha=$sourceHead`nWorkflowSha=$env:GITHUB_SHA`nRunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" |
            Set-Content -Path TestResults/APP-01C2-TestRunId.txt -Encoding utf8
          Write-Host "APP-01C.2 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01C.3 A25 TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01c3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          "TestRunId=$id`nSourceHeadSha=$sourceHead`nWorkflowSha=$env:GITHUB_SHA`nRunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" |
            Set-Content -Path TestResults/APP-01C3-TestRunId.txt -Encoding utf8
          Write-Host "APP-01C.3 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01C.4 oracle TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01c4-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          "TestRunId=$id`nSourceHeadSha=$sourceHead`nWorkflowSha=$env:GITHUB_SHA`nRunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" |
            Set-Content -Path TestResults/APP-01C4-TestRunId.txt -Encoding utf8
          Write-Host "APP-01C.4 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01D SQL oracle TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01d-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          "TestRunId=$id`nSourceHeadSha=$sourceHead`nWorkflowSha=$env:GITHUB_SHA`nRunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" |
            Set-Content -Path TestResults/APP-01D-TestRunId.txt -Encoding utf8
          Write-Host "APP-01D TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01E.1 TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01e1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          @("TestRunId=$id", "SourceHeadSha=$sourceHead", "WorkflowSha=$env:GITHUB_SHA",
            "RunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") |
            Set-Content -Path TestResults/APP-01E1-TestRunId.txt -Encoding utf8
          Write-Host "APP-01E.1 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01E.2 TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01e2-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          @("TestRunId=$id", "SourceHeadSha=$sourceHead", "WorkflowSha=$env:GITHUB_SHA",
            "RunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") |
            Set-Content -Path TestResults/APP-01E2-TestRunId.txt -Encoding utf8
          Write-Host "APP-01E.2 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01E.3 TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01e3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          @("TestRunId=$id", "SourceHeadSha=$sourceHead", "WorkflowSha=$env:GITHUB_SHA",
            "RunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") |
            Set-Content -Path TestResults/APP-01E3-TestRunId.txt -Encoding utf8
          Write-Host "APP-01E.3 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01E.4 TCP/process restart TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01e4-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          @("TestRunId=$id", "SourceHeadSha=$sourceHead", "WorkflowSha=$env:GITHUB_SHA",
            "RunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") |
            Set-Content -Path TestResults/APP-01E4-TestRunId.txt -Encoding utf8
          Write-Host "APP-01E.4 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-01E.5 reconciliation TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app01e5-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          @("TestRunId=$id", "SourceHeadSha=$sourceHead", "WorkflowSha=$env:GITHUB_SHA",
            "RunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") |
            Set-Content -Path TestResults/APP-01E5-TestRunId.txt -Encoding utf8
          Write-Host "APP-01E.5 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-02A.2 two-tenant schema TestRunId and exact source HEAD
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app02a2-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          @("TestRunId=$id", "SourceHeadSha=$sourceHead", "WorkflowSha=$env:GITHUB_SHA",
            "RunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") |
            Set-Content -Path TestResults/APP-02A2-TestRunId.txt -Encoding utf8
          Write-Host "APP-02A.2 TestRunId=$id; SourceHead=$sourceHead; WorkflowSha=$env:GITHUB_SHA"
      - name: Record APP-02A.3 worker/recovery TestRunId and enforce final-head test count
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $id = "app02a3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          $trx = @(Get-ChildItem -Path TestResults -Recurse -File -Filter '*.trx')
          if ($trx.Count -ne 1) { throw "APP-02A.3 requires exactly one MTP TRX report, found $($trx.Count)" }
          [xml]$result = Get-Content -Path $trx[0].FullName -Raw
          $counter = $result.SelectSingleNode("//*[local-name()='Counters']")
          if ($null -eq $counter) { throw 'APP-02A.3 missing TRX Counters' }
          $total = [int]$counter.GetAttribute('total')
          $passed = [int]$counter.GetAttribute('passed')
          $failed = [int]$counter.GetAttribute('failed')
          $notExecuted = [int]$counter.GetAttribute('notExecuted')
          if ($total -lt 272 -or $passed -ne $total -or $failed -ne 0 -or $notExecuted -ne 0) {
            throw "APP-02A.3 TestRunId=$id fails 272+ / zero-failure / zero-skip gate: total=$total passed=$passed failed=$failed skipped=$notExecuted"
          }
          @("TestRunId=$id", "SourceHeadSha=$sourceHead",
            "WorkflowSha=$env:GITHUB_SHA",
            "RunUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "TotalTests=$total", "PassedTests=$passed", "FailedTests=$failed",
            "NotExecutedTests=$notExecuted", "AcceptanceScope=APP-02A.3_SYNTHETIC_NONPRODUCTION",
            "A11IndependentOracle=SEPARATE_APP02A4_GATE", "ActualEV08=NOT_VERIFIED",
            "ProductionP0=NOT_VERIFIED") |
            Set-Content -Path TestResults/APP-02A3-TestRunId.txt -Encoding utf8
          Write-Host "APP-02A.3 TestRunId=$id; SourceHead=$sourceHead; total=$total passed=$passed failed=$failed skipped=$notExecuted"
      - name: Record APP-02A.4 source, workflow and independent verification scope
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $source = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($source)) { $source = $env:GITHUB_SHA }
          $id = "app02a4-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          @("TestRunId=$id", "SourceHeadSha=$source", "WorkflowSha=$env:GITHUB_SHA",
            "AcceptanceScope=APP-02A.4_SYNTHETIC_NONPRODUCTION",
            "OracleGroups=12x2", "ExpectedCheckpoints=60", "ExpectedSqlCells=1440",
            "ActualEV08=NOT_VERIFIED", "ProductionP0=NOT_VERIFIED",
            "OwnerAuthorizationAPP02B_E=NOT_AUTHORIZED") |
            Set-Content -Path TestResults/APP-02A4-TestRunId.txt -Encoding utf8
      - name: Fail closed on APP-01B.3 SQL oracle actual/diff
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem tests -Recurse -File -Filter '*-oracle.json' |
            Where-Object { $_.FullName -like '*TestResults*APP-01B3*' })
          if ($reports.Count -ne 2) { throw "Expected 2 APP-01B.3 tenant SQL oracle reports; found $($reports.Count)" }
          $expectedNames = @('tenant-a-oracle.json','tenant-b-oracle.json')
          $id = "app01b3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          $hash = (Get-FileHash business/reference-data/expected-results/golden-oracles.json -Algorithm SHA256).Hash
          foreach ($name in $expectedNames) {
            $found = @($reports | Where-Object { $_.Name -eq $name })
            if ($found.Count -ne 1) { throw "Missing or duplicated oracle report $name" }
            $report = Get-Content $found[0].FullName -Raw | ConvertFrom-Json
            if ($report.Status -ne 'PASS' -or $report.ExpectedCells -ne 39 -or
                $report.CheckedCells -ne 39 -or $report.MatchedCells -ne 39 -or
                @($report.Cells).Count -ne 39 -or @($report.Steps).Count -ne 3 -or
                @($report.Cells | Where-Object { -not $_.Match }).Count -ne 0) {
              throw "Oracle $name did not match 39/39; status=$($report.Status), matched=$($report.MatchedCells)"
            }
            if ($report.TestRunId -ne $id -or $report.SourceHeadSha -ne $sourceHead -or
                $report.WorkflowSha -ne $env:GITHUB_SHA -or $report.OracleSha256 -ne $hash) {
              throw "Oracle $name lacks correct run, source SHA or immutable baseline provenance"
            }
            Write-Host "APP-01B.3 $name : 39/39 persisted SQL cells PASS ($id)"
          }
      - name: Fail closed on APP-01C.4 independently persisted T0-T4 SQL oracles
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem tests -Recurse -File -Filter '*-oracle.json' |
            Where-Object { $_.FullName -like '*TestResults*APP-01C4*' })
          if ($reports.Count -ne 2) { throw "Expected exactly 2 independent APP-01C.4 tenant SQL reports; found $($reports.Count)" }
          $id = "app01c4-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          $hash = (Get-FileHash business/reference-data/expected-results/golden-oracles.json -Algorithm SHA256).Hash
          $expectedSteps = @('T0','T1_LOAD','T2_REJECT','T3_B20','T4_A25')
          $expectedFields = @('step','mainQty','tripQty','soldQty','mainCost',
            'tripCost','cogs','aHold','bQuota','arA','arB','custody','fund')
          $oracle = (Get-Content business/reference-data/expected-results/golden-oracles.json -Raw |
            ConvertFrom-Json).'AC-03'
          if ((@($oracle.cols) -join '|') -cne ($expectedFields -join '|') -or
              @($oracle.steps).Count -lt 5) {
            throw 'The immutable AC-03 expected schema has changed'
          }
          foreach ($tenant in @('tenant-a','tenant-b')) {
            $name = "$tenant-oracle.json"
            $found = @($reports | Where-Object { $_.Name -eq $name })
            if ($found.Count -ne 1) { throw "Missing or duplicated C.4 SQL report $name" }
            $r = Get-Content $found[0].FullName -Raw | ConvertFrom-Json
            if ($r.Schema -ne 'APP01C4_SQL_ORACLE_V1' -or $r.TenantId -ne $tenant -or
                $r.Status -ne 'PASS' -or $r.Failure -or
                $r.ExpectedCells -ne 65 -or $r.CheckedCells -ne 65 -or
                $r.MatchedCells -ne 65 -or @($r.Cells).Count -ne 65 -or
                @($r.Cells | Where-Object { -not $_.Match }).Count -ne 0 -or
                @($r.Steps).Count -ne 5) {
              throw "APP-01C.4 $name failed 65/65 SQL evidence gate"
            }
            if ($r.TestRunId -ne $id -or $r.SourceHeadSha -ne $sourceHead -or
                $r.WorkflowSha -ne $env:GITHUB_SHA -or $r.OracleSha256 -ne $hash) {
              throw "APP-01C.4 $name missing exact run/source SHA or immutable oracle hash"
            }
            if ($r.Database -notmatch '^Fmcg_App00_[a-f0-9]{32}_[AB]$' -or
                (($tenant -eq 'tenant-a') -and !$r.Database.EndsWith('_A')) -or
                (($tenant -eq 'tenant-b') -and !$r.Database.EndsWith('_B'))) {
              throw "APP-01C.4 $name is not backed by its own nonce LocalDB"
            }
            for ($i = 0; $i -lt 5; $i++) {
              $snapshot = $r.Steps[$i]
              $rowCells = @($r.Cells | Where-Object { $_.Row -eq $i })
              if ($snapshot.Row -ne $i -or $snapshot.Step -cne $expectedSteps[$i] -or
                  $oracle.steps[$i][0] -cne $expectedSteps[$i] -or
                  -not $snapshot.Evidence.LedgerDigest -or
                  -not $snapshot.PostingDigest -or $rowCells.Count -ne 13 -or
                  @($snapshot.Actual.PSObject.Properties).Count -ne 12) {
                throw "APP-01C.4 $name incomplete checkpoint index $i"
              }
              # Independently validate every field identity, locked expected value,
              # SQL snapshot actual, and signed actual-minus-expected decimal diff.
              # Cardinality alone must never accept duplicate or substituted cells.
              for ($j = 0; $j -lt 13; $j++) {
                $field = $expectedFields[$j]
                $matches = @($rowCells | Where-Object { $_.Field -ceq $field })
                if ($matches.Count -ne 1) {
                  throw "APP-01C.4 $name row $i missing/duplicated $field"
                }
                $cell = $matches[0]
                if ($j -eq 0) {
                  if ($cell.Expected -cne $expectedSteps[$i] -or
                      $cell.Actual -cne $expectedSteps[$i] -or
                      $null -ne $cell.Difference) {
                    throw "APP-01C.4 $name row $i has altered step cell"
                  }
                } else {
                  if ($null -eq $snapshot.Actual.PSObject.Properties[$field] -or
                      $null -eq $cell.Difference) {
                    throw "APP-01C.4 $name row $i missing SQL value/diff $field"
                  }
                  $expected = [decimal]::Parse([string]$oracle.steps[$i][$j],
                    [Globalization.CultureInfo]::InvariantCulture)
                  $reportedExpected = [decimal]::Parse([string]$cell.Expected,
                    [Globalization.CultureInfo]::InvariantCulture)
                  $actual = [decimal]::Parse([string]$cell.Actual,
                    [Globalization.CultureInfo]::InvariantCulture)
                  $sqlActual = [decimal]$snapshot.Actual.$field
                  if ($reportedExpected -ne $expected -or $actual -ne $expected -or
                      $actual -ne $sqlActual -or
                      [decimal]$cell.Difference -ne ($actual - $expected)) {
                    throw "APP-01C.4 $name row $i invalid expected/actual/diff $field"
                  }
                }
              }
            }
            if ($r.Steps[3].Evidence.Sources -ne 6 -or
                $r.Steps[3].Evidence.SourceLines -ne 7 -or
                $r.Steps[3].Evidence.LedgerRows -ne 14 -or
                $r.Steps[4].Evidence.Sources -ne 7 -or
                $r.Steps[4].Evidence.SourceLines -ne 8 -or
                $r.Steps[4].Evidence.LedgerRows -ne 18 -or
                $r.Steps[3].Posting.ValidAllocations -ne 1 -or
                $r.Steps[4].Posting.ValidAllocations -ne 1 -or
                $r.Steps[4].Posting.AllocatedCash -ne 200) {
              throw "APP-01C.4 $name incomplete T3/T4 source/credit/cash envelope"
            }
            if ($r.Steps[3].Posting.Sales -ne 1 -or $r.Steps[3].Posting.SourceLinked -ne 1 -or
                $r.Steps[3].Posting.BEffectRows -ne 7 -or $r.Steps[3].Posting.AEffectRows -ne 0 -or
                $r.Steps[4].Posting.Sales -ne 2 -or $r.Steps[4].Posting.SourceLinked -ne 2 -or
                $r.Steps[4].Posting.BEffectRows -ne 7 -or $r.Steps[4].Posting.AEffectRows -ne 4) {
              throw "APP-01C.4 $name missing SQL posting source/ledger lineage"
            }
            Write-Host "APP-01C.4 $name : 65/65 persisted SQL cells PASS ($id; $sourceHead)"
          }
      - name: Fail closed on APP-01D independently persisted T0-T6 SQL oracles
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem tests -Recurse -File -Filter '*-oracle.json' |
            Where-Object { $_.FullName -like '*TestResults*APP-01D*' })
          if ($reports.Count -ne 2) { throw "Expected exactly 2 independent APP-01D tenant SQL reports; found $($reports.Count)" }
          $id = "app01d-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          $hash = (Get-FileHash business/reference-data/expected-results/golden-oracles.json -Algorithm SHA256).Hash
          $expectedSteps = @('T0','T1_LOAD','T2_REJECT','T3_B20','T4_A25','T5_HANDOVER','T6_RETURN')
          $expectedFields = @('step','mainQty','tripQty','soldQty','mainCost',
            'tripCost','cogs','aHold','bQuota','arA','arB','custody','fund')
          $oracle = (Get-Content business/reference-data/expected-results/golden-oracles.json -Raw |
            ConvertFrom-Json).'AC-03'
          if ((@($oracle.cols) -join '|') -cne ($expectedFields -join '|') -or
              @($oracle.steps).Count -lt 7) {
            throw 'The immutable AC-03 expected schema has changed'
          }
          foreach ($tenant in @('tenant-a','tenant-b')) {
            $name = "$tenant-oracle.json"
            $found = @($reports | Where-Object { $_.Name -eq $name })
            if ($found.Count -ne 1) { throw "Missing or duplicated D SQL report $name" }
            $r = Get-Content $found[0].FullName -Raw | ConvertFrom-Json
            if ($r.Schema -ne 'APP01D_SQL_ORACLE_V1' -or $r.TenantId -ne $tenant -or
                $r.Status -ne 'PASS' -or $r.Failure -or
                $r.ExpectedCells -ne 91 -or $r.CheckedCells -ne 91 -or
                $r.MatchedCells -ne 91 -or @($r.Cells).Count -ne 91 -or
                @($r.Cells | Where-Object { -not $_.Match }).Count -ne 0 -or
                @($r.Steps).Count -ne 7) {
              throw "APP-01D $name failed 91/91 SQL evidence gate"
            }
            if ($r.TestRunId -ne $id -or $r.SourceHeadSha -ne $sourceHead -or
                $r.WorkflowSha -ne $env:GITHUB_SHA -or $r.OracleSha256 -ne $hash) {
              throw "APP-01D $name missing exact run/source SHA or immutable oracle hash"
            }
            if ($r.Database -notmatch '^Fmcg_App00_[a-f0-9]{32}_[AB]$' -or
                (($tenant -eq 'tenant-a') -and !$r.Database.EndsWith('_A')) -or
                (($tenant -eq 'tenant-b') -and !$r.Database.EndsWith('_B'))) {
              throw "APP-01D $name is not backed by its own nonce LocalDB"
            }
            for ($i = 0; $i -lt 7; $i++) {
              $snapshot = $r.Steps[$i]
              $rowCells = @($r.Cells | Where-Object { $_.Row -eq $i })
              if ($snapshot.Row -ne $i -or $snapshot.Step -cne $expectedSteps[$i] -or
                  $oracle.steps[$i][0] -cne $expectedSteps[$i] -or
                  -not $snapshot.Evidence.LedgerDigest -or
                  -not $snapshot.PostingDigest -or $rowCells.Count -ne 13 -or
                  @($snapshot.Actual.PSObject.Properties).Count -ne 12) {
                throw "APP-01D $name incomplete checkpoint index $i"
              }
              # Independently validate every field identity, locked expected value,
              # SQL snapshot actual, and signed actual-minus-expected decimal diff.
              # Cardinality alone must never accept duplicate or substituted cells.
              for ($j = 0; $j -lt 13; $j++) {
                $field = $expectedFields[$j]
                $matches = @($rowCells | Where-Object { $_.Field -ceq $field })
                if ($matches.Count -ne 1) {
                  throw "APP-01D $name row $i missing/duplicated $field"
                }
                $cell = $matches[0]
                if ($j -eq 0) {
                  if ($cell.Expected -cne $expectedSteps[$i] -or
                      $cell.Actual -cne $expectedSteps[$i] -or
                      $null -ne $cell.Difference) {
                    throw "APP-01D $name row $i has altered step cell"
                  }
                } else {
                  if ($null -eq $snapshot.Actual.PSObject.Properties[$field] -or
                      $null -eq $cell.Difference) {
                    throw "APP-01D $name row $i missing SQL value/diff $field"
                  }
                  $expected = [decimal]::Parse([string]$oracle.steps[$i][$j],
                    [Globalization.CultureInfo]::InvariantCulture)
                  $reportedExpected = [decimal]::Parse([string]$cell.Expected,
                    [Globalization.CultureInfo]::InvariantCulture)
                  $actual = [decimal]::Parse([string]$cell.Actual,
                    [Globalization.CultureInfo]::InvariantCulture)
                  $sqlActual = [decimal]$snapshot.Actual.$field
                  if ($reportedExpected -ne $expected -or $actual -ne $expected -or
                      $actual -ne $sqlActual -or
                      [decimal]$cell.Difference -ne ($actual - $expected)) {
                    throw "APP-01D $name row $i invalid expected/actual/diff $field"
                  }
                }
              }
            }
            if ($r.Steps[3].Evidence.Sources -ne 6 -or
                $r.Steps[3].Evidence.SourceLines -ne 7 -or
                $r.Steps[3].Evidence.LedgerRows -ne 14 -or
                $r.Steps[4].Evidence.Sources -ne 7 -or
                $r.Steps[4].Evidence.SourceLines -ne 8 -or
                $r.Steps[4].Evidence.LedgerRows -ne 18 -or
                $r.Steps[3].Posting.ValidAllocations -ne 1 -or
                $r.Steps[4].Posting.ValidAllocations -ne 1 -or
                $r.Steps[4].Posting.AllocatedCash -ne 200) {
              throw "APP-01D $name incomplete T3/T4 source/credit/cash envelope"
            }
            if ($r.Steps[3].Posting.Sales -ne 1 -or $r.Steps[3].Posting.SourceLinked -ne 1 -or
                $r.Steps[3].Posting.BEffectRows -ne 7 -or $r.Steps[3].Posting.AEffectRows -ne 0 -or
                $r.Steps[4].Posting.Sales -ne 2 -or $r.Steps[4].Posting.SourceLinked -ne 2 -or
                $r.Steps[4].Posting.BEffectRows -ne 7 -or $r.Steps[4].Posting.AEffectRows -ne 4) {
              throw "APP-01D $name missing SQL posting source/ledger lineage"
            }
            # T5 OFFER must be invisible to custody/fund; only cashier ACCEPT
            # adds two legs. T6 appends two paired transfers and a B release.
            # Financial posting provenance remains byte-identical to T4.
            if ($r.Steps[5].Evidence.Sources -ne 9 -or
                $r.Steps[5].Evidence.SourceLines -ne 10 -or
                $r.Steps[5].Evidence.LedgerRows -ne 20 -or
                $r.Steps[6].Evidence.Sources -ne 10 -or
                $r.Steps[6].Evidence.SourceLines -ne 12 -or
                $r.Steps[6].Evidence.LedgerRows -ne 25 -or
                $r.Steps[6].Evidence.PhysicalLegs -ne 10 -or
                $r.Steps[5].PostingDigest -cne $r.Steps[4].PostingDigest -or
                $r.Steps[6].PostingDigest -cne $r.Steps[4].PostingDigest -or
                $r.Steps[6].Posting.Sales -ne 2 -or
                $r.Steps[6].Posting.ReceiptReceived -ne 200 -or
                $r.Steps[6].Posting.OutstandingAr -ne 475) {
              throw "APP-01D $name missing source-bound cashier/unload ledger envelope"
            }
            Write-Host "APP-01D $name : 91/91 persisted SQL cells PASS ($id; $sourceHead)"
          }
      - name: Fail closed on APP-01E.1 physical SQL recovery evidence
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem tests -Recurse -File -Filter '*-harness.json' |
            Where-Object { $_.FullName -like '*TestResults*APP-01E1*' })
          if ($reports.Count -ne 6) { throw "Expected 6 E.1 reports; found $($reports.Count)" }
          $id = "app01e1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          $cases = @{
            'two-client-gate' = @('AFTER_BOTH_HTTP_CLIENTS')
            'precommit-rollback' = @('FAULT_PRECOMMIT_ROLLED_BACK','RETRY_SAME_IDENTITY')
            'lost-ack-smoke' = @('POSTCOMMIT_ACK_SUPPRESSED','SAME_IDENTITY_REPLAY')
          }
          $fields = @('BusinessCommand','BusinessSource','BusinessSourceLine',
                      'LedgerEffect','StockRight','StockPoolAllocated')
          foreach ($tenant in @('tenant-a','tenant-b')) {
            foreach ($case in @('two-client-gate','precommit-rollback','lost-ack-smoke')) {
              $name = "$tenant-$case-harness.json"
              $found = @($reports | Where-Object { $_.Name -ceq $name })
              if ($found.Count -ne 1) { throw "Missing or duplicate E.1 report $name" }
              $report = Get-Content $found[0].FullName -Raw | ConvertFrom-Json
              if ($report.Schema -cne 'APP01E1_HARNESS_V1' -or $report.Status -cne 'PASS' -or
                  $report.TenantId -cne $tenant -or $report.Scenario -cne $case -or
                  $report.TestRunId -cne $id -or $report.SourceHeadSha -cne $sourceHead -or
                  $report.WorkflowSha -cne $env:GITHUB_SHA) {
                throw "E.1 provenance/schema mismatch $name"
              }
              if ($report.Database -cnotmatch '^Fmcg_App00_[a-f0-9]{32}_[AB]$' -or
                  (($tenant -eq 'tenant-a') -and !$report.Database.EndsWith('_A')) -or
                  (($tenant -eq 'tenant-b') -and !$report.Database.EndsWith('_B'))) {
                throw "E.1 unsafe DB identity $name"
              }
              $stages = @($report.Stages)
              $expectedStages = @($cases[$case])
              if ($stages.Count -ne $expectedStages.Count) { throw "Wrong E.1 stages $name" }
              for ($i=0; $i -lt $expectedStages.Count; $i++) {
                $stage = $stages[$i]
                $rollback = $stage.Stage -ceq 'FAULT_PRECOMMIT_ROLLED_BACK'
                if ($stage.Stage -cne $expectedStages[$i] -or $stage.ExpectedCells -ne 6 -or
                    $stage.MatchedCells -ne 6 -or @($stage.Cells).Count -ne 6 -or
                    $stage.Sql.Database -cne $report.Database -or
                    $stage.Sql.TenantId -cne $tenant -or
                    $stage.Sql.ProducerId -cne 'app01e1-harness' -or
                    $stage.Sql.CommandId -cnotmatch '^[a-f0-9]{32}$' -or
                    $stage.Sql.LedgerSha256 -cnotmatch '^[0-9A-F]{64}$') {
                  throw "Incomplete SQL stage $name index $i"
                }
                if ($rollback) {
                  if ($stage.Sql.Status -or $stage.Sql.SourceId -or
                      $stage.Sql.SourceKind -or $stage.Sql.SourceNumber -or
                      $stage.Sql.SourceActorId -or $stage.Sql.SourceTripId -or
                      $null -ne $stage.Sql.SourceLineQuantity -or
                      $stage.Sql.BQuotaRows -ne 0 -or
                      $stage.Sql.RightKind -or $stage.Sql.RightStatus -or
                      $null -ne $stage.Sql.RightGranted -or
                      $null -ne $stage.Sql.RightConsumed -or
                      $null -ne $stage.Sql.RightReleased -or
                      $stage.Sql.EffectKey -or $stage.Sql.LedgerKind -or
                      $null -ne $stage.Sql.EffectQuantity -or
                      $null -ne $stage.Sql.EffectAmount) {
                    throw "Rollback left source/right/ledger details $name"
                  }
                } else {
                  if ($stage.Sql.Status -cne 'APPLIED' -or
                      $stage.Sql.OutcomeCode -cne 'B_QUOTA_GRANTED' -or
                      !$stage.Sql.SourceId -or
                      $stage.Sql.SourceKind -cne 'STOCK_ALLOC' -or
                      $stage.Sql.SourceNumber -cnotmatch '^[a-f0-9]{32}$' -or
                      $stage.Sql.SourceActorId -cne 'e1-warehouse-actor' -or
                      !$stage.Sql.SourceTripId -or
                      $stage.Sql.SourceLineQuantity -ne 30 -or
                      $stage.Sql.BQuotaRows -ne 1 -or
                      $stage.Sql.RightKind -cne 'B' -or
                      $stage.Sql.RightStatus -cne 'HELD' -or
                      $stage.Sql.RightGranted -ne 30 -or
                      $stage.Sql.RightConsumed -ne 0 -or
                      $stage.Sql.RightReleased -ne 0 -or
                      $stage.Sql.EffectKey -cne 'RIGHT-ALLOCATED' -or
                      $stage.Sql.LedgerKind -cne 'RIGHT_B' -or
                      $stage.Sql.EffectQuantity -ne 30 -or
                      $stage.Sql.EffectAmount -ne 0) {
                    throw "Incorrect committed SQL source/right/ledger semantics $name"
                  }
                }
                foreach ($field in $fields) {
                  $match = @($stage.Cells | Where-Object { $_.Field -ceq $field })
                  if ($match.Count -ne 1) { throw "Missing or duplicate SQL cell $field in $name" }
                  $expected = if ($rollback) { 0 } elseif ($field -eq 'StockPoolAllocated') { 30 } else { 1 }
                  $cell = $match[0]
                  if ($cell.Expected -ne $expected -or $cell.Actual -ne $expected -or
                      $cell.Diff -ne 0 -or !$cell.Match) {
                    throw "E.1 actual/diff mismatch $name stage $i field $field"
                  }
                }
              }
              if ($case -eq 'lost-ack-smoke' -and
                  $stages[0].Sql.LedgerSha256 -cne $stages[1].Sql.LedgerSha256) {
                throw "Lost ACK replay changed persisted ledger fingerprint $name"
              }
              Write-Host "APP-01E.1 $name verified on SQL: $id"
            }
          }
      - name: Fail closed on APP-01E.2 cross-command race SQL reconciliation
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem tests -Recurse -File -Filter '*-race.json' |
            Where-Object { $_.FullName -like '*TestResults*APP-01E2*' })
          if ($reports.Count -ne 16) { throw "Expected 16 E.2 SQL race reports, got $($reports.Count)" }
          $cases = @('rights-pool','manifest-vs-b20','a25-vs-b20','a25-vs-unload',
                     'b20-vs-unload','cashier-accept-vs-unload',
                     'cashier-accept-vs-accept','cashier-offer-vs-accept')
          $fields = @('WarehouseQty','WarehouseCost','VehicleQty','VehicleCost',
                     'PoolAllocated','AGranted','BGranted','AConsumed','BConsumed',
                     'BReleased','ArA','ArB','Cogs','Custody','Fund','ReceiptApplied',
                     'ARows','BRows','Offers','Acceptances','Unloads','ManifestsLoaded','InvoiceEligible')
          $id = "app01e2-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceHead = '${{ github.event.pull_request.head.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceHead)) { $sourceHead = $env:GITHUB_SHA }
          $total = 0
          foreach ($tenant in @('tenant-a','tenant-b')) {
            foreach ($case in $cases) {
              $name = "$tenant-$case-race.json"
              $found = @($reports | Where-Object { $_.Name -ceq $name })
              if ($found.Count -ne 1) { throw "Missing/duplicate E.2 report $name" }
              $r = Get-Content $found[0].FullName -Raw | ConvertFrom-Json
              if ($r.Schema -cne 'APP01E2_RACE_V1' -or $r.Status -cne 'PASS' -or
                  $r.TenantId -cne $tenant -or $r.Scenario -cne $case -or
                  $r.TestRunId -cne $id -or $r.SourceHeadSha -cne $sourceHead -or
                  $r.WorkflowSha -cne $env:GITHUB_SHA -or $r.Sql.Tenant -cne $tenant -or
                  $r.ObservedSqlWaiters -lt 2 -or $r.ExpectedCells -ne 23 -or
                  $r.MatchedCells -ne 23 -or @($r.Cells).Count -ne 23 -or
                  $r.Sql.LedgerSha256 -cnotmatch '^[A-F0-9]{64}$') {
                throw "E.2 provenance / SQL wait witness invalid: $name"
              }
              if ($r.Sql.Database -cnotmatch '^Fmcg_App00_[a-f0-9]{32}_[AB]$' -or
                  ($tenant -eq 'tenant-a' -and !$r.Sql.Database.EndsWith('_A')) -or
                  ($tenant -eq 'tenant-b' -and !$r.Sql.Database.EndsWith('_B'))) {
                throw "E.2 wrong LocalDB ownership: $name"
              }
              foreach ($side in @('Left','Right')) {
                $cmd = $r.$side
                $a = $cmd.Audit
                $o = $cmd.Outcome
                if ($cmd.ProducerId -cne 'app01e2-races' -or
                    $cmd.CommandId -cnotmatch '^[a-f0-9]{32}$' -or
                    $cmd.SourceNumber -cnotmatch '^[a-f0-9]{32}$' -or
                    $cmd.Http -ne 200 -or $o.Replayed -or
                    $o.Status -cne $a.Status -or $o.OutcomeCode -cne $a.OutcomeCode -or
                    $o.ReasonCode -cne $a.ReasonCode -or
                    $cmd.Actor -cne $a.CommandActor) {
                  throw "E.2 HTTP/SQL command mismatch $name $side"
                }
                if ($o.Status -ceq 'APPLIED') {
                  if (!$o.SourceId -or $o.SourceId -cne $a.SourceId -or
                      $a.SourceKind -cne $cmd.SourceKind -or
                      $a.SourceNumber -cne $cmd.SourceNumber -or
                      $a.SourceActor -cne $cmd.Actor -or !$a.SourceTrip -or
                      $a.Lines -le 0 -or $a.Effects -lt 0) {
                    throw "E.2 applied source/ledger mismatch $name $side"
                  }
                } elseif ($o.Status -ceq 'REJECTED' -and $o.OutcomeCode -ceq 'REJECTED') {
                  if ($o.SourceId -or $a.SourceId -or $a.Lines -ne 0 -or
                      $a.Effects -ne 0) { throw "E.2 rejected command posted $name $side" }
                } else { throw "E.2 invalid terminal command status $name $side" }
              }
              if (!$r.Replay.StateUnchanged -or
                  $r.Replay.BeforeLedgerSha256 -cne $r.Sql.LedgerSha256 -or
                  $r.Replay.AfterLedgerSha256 -cne $r.Sql.LedgerSha256) {
                throw "E.2 replay altered lineage or physical state: $name"
              }
              foreach ($side in @('Left','Right')) {
                $original = $r.$side.Outcome
                $replay = $r.Replay.$side
                if ($replay.Http -ne 200 -or !$replay.Outcome.Replayed -or
                    $replay.Outcome.Status -cne $original.Status -or
                    $replay.Outcome.OutcomeCode -cne $original.OutcomeCode -or
                    $replay.Outcome.ReasonCode -cne $original.ReasonCode -or
                    $replay.Outcome.SourceId -cne $original.SourceId) {
                  throw "E.2 replay outcome mismatch: $name $side"
                }
              }
              foreach ($field in $fields) {
                $matches = @($r.Cells | Where-Object { $_.Field -ceq $field })
                if ($matches.Count -ne 1) { throw "E.2 missing or duplicate field $name $field" }
                $cell = $matches[0]
                if (!$cell.Match -or $cell.Diff -ne 0 -or
                    $cell.Actual -ne $cell.Expected -or
                    $cell.Actual -ne $r.Sql.Numbers.$field) {
                  throw "E.2 SQL actual/diff mismatch $name $field"
                }
                $total++
              }
              Write-Host "APP-01E.2 $name 23/23, SQL waiters $($r.ObservedSqlWaiters)"
            }
          }
          if ($total -ne 368) { throw "Expected 368 physical E.2 SQL cells, got $total" }
      - name: Fail closed on APP-01E.3 rollback and safe retry SQL matrix
        env:
          APP01E3_TEST_RUN_ID: app01e3-${{ github.run_id }}-${{ github.run_attempt }}
          APP01E3_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: ./scripts/Verify-App01E3.ps1
      - name: Fail closed on APP-01E.4 real lost ACK/process restart evidence
        env:
          APP01E4_TEST_RUN_ID: app01e4-${{ github.run_id }}-${{ github.run_attempt }}
          APP01E4_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: ./scripts/Verify-App01E4.ps1
      - name: Fail closed on APP-01E.5 independent cross-transaction SQL reconciliation
        env:
          APP01E5_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: ./scripts/Verify-App01E5.ps1
      - name: Fail closed on APP-02A.4 12x2 independent physical SQL oracle, source and outbox reconciliation
        env:
          APP02A4_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: ./scripts/Verify-App02A4.ps1
      - name: Verify MTP test evidence exists
        shell: pwsh
        run: |
          $results = Get-ChildItem -Path TestResults -Recurse -File -ErrorAction Stop
          if (-not ($results | Where-Object { $_.Extension -eq '.trx' })) { throw 'Expected MTP TRX evidence is missing.' }
          if (-not ($results | Where-Object { $_.Name -like '*.cobertura.xml' })) { throw 'Expected Cobertura coverage evidence is missing.' }
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app00a-test-evidence
          path: '**/TestResults/**/*'
          if-no-files-found: warn

  web_sales:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use runner temporary NuGet package directory
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'app00a-nuget-packages'
          "NUGET_PACKAGES=$packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'
      - name: Verify pinned SDK
        shell: pwsh
        run: |
          $actual = (dotnet --version).Trim()

name: APP-02B.3 identity and sessions (CI-only)
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  identity-b3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'
      - name: Check pinned SDK
        run: test "$(dotnet --version)" = '10.0.404'
      - name: Build B.3 Identity and isolated PREPROD API
        run: |
          dotnet restore tests/FmcgDms.Preprod.Identity.Tests/FmcgDms.Preprod.Identity.Tests.csproj
          dotnet build tests/FmcgDms.Preprod.Identity.Tests/FmcgDms.Preprod.Identity.Tests.csproj -c Release --no-restore
          dotnet restore src/FmcgDms.Preprod.Api/FmcgDms.Preprod.Api.csproj
          dotnet build src/FmcgDms.Preprod.Api/FmcgDms.Preprod.Api.csproj -c Release --no-restore
      - name: B3 JWT, rotation/reuse, revocation, Identity and Origin negatives
        run: |
          dotnet test tests/FmcgDms.Preprod.Identity.Tests/FmcgDms.Preprod.Identity.Tests.csproj -c Release --no-build -- --report-trx
      - name: Preserve B2 inert-mode runtime negatives
        run: |
          dotnet test tests/FmcgDms.Preprod.Runtime.Tests/FmcgDms.Preprod.Runtime.Tests.csproj -c Release -- --report-trx
      - name: CI-only provenance
        if: always()
        shell: bash
        env:
          B3_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p TestResults
          printf 'TestRunId=app02b3-ci-%s-%s\nSourceHeadSha=%s\nWorkflowSha=%s\nEnvironment=GITHUB_HOSTED_CI_NOT_PREPROD\nStatus=CI_TEST_ONLY_NO_REAL_PREPROD_GATE\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$B3_SOURCE_HEAD" "$GITHUB_SHA" \
            > TestResults/APP-02B3-CI-ONLY.txt
      - name: Evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app02b3-ci-only
          path: |
            TestResults/
            tests/FmcgDms.Preprod.Identity.Tests/TestResults/
            tests/FmcgDms.Preprod.Runtime.Tests/TestResults/
          if-no-files-found: warn

  identity-sql-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'
      - name: Check pinned SDK and SQL Server LocalDB
        shell: pwsh
        run: |
          if ((dotnet --version).Trim() -ne '10.0.404') { throw 'Incorrect SDK' }
          sqllocaldb info MSSQLLocalDB
          sqllocaldb start MSSQLLocalDB
          sqlcmd -S '(localdb)\MSSQLLocalDB' -E -Q 'SELECT @@VERSION AS SqlEngineVersion'
      - name: Build isolated SQL Server migration / concurrency test
        shell: pwsh
        run: |
          dotnet restore tests/FmcgDms.Preprod.Identity.SqlServer.Tests/FmcgDms.Preprod.Identity.SqlServer.Tests.csproj
          dotnet build tests/FmcgDms.Preprod.Identity.SqlServer.Tests/FmcgDms.Preprod.Identity.SqlServer.Tests.csproj -c Release --no-restore
      - name: Real SQL Server LocalDB idempotent migration and two-client same-grant race
        shell: pwsh
        env:
          APP02B3_SQL_SERVER: '(localdb)\MSSQLLocalDB'
          APP02B3_TEST_RUN_ID: app02b3-sql-${{ github.run_id }}-${{ github.run_attempt }}
          APP02B3_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dotnet test tests/FmcgDms.Preprod.Identity.SqlServer.Tests/FmcgDms.Preprod.Identity.SqlServer.Tests.csproj -c Release --no-build -- --report-trx
      - name: Gate SQL witness, redacted provenance and source SHA
        shell: pwsh
        env:
          APP02B3_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $files = @(Get-ChildItem -Path . -Filter 'APP-02B3-SQL-WITNESS.json' -File -Recurse)
          if ($files.Count -ne 1) { throw "Missing/ambiguous independently observed SQL witness" }
          $e = Get-Content -Raw $files[0].FullName | ConvertFrom-Json
          if ($e.SourceHeadSha -cne $env:APP02B3_SOURCE_HEAD_SHA -or
              $e.SchemaVersion -cne 'B3_20261117_001' -or
              $e.MigrationFirstApply -cne 'PASS' -or
              $e.MigrationReplay -cne 'PASS' -or
              $e.ConcurrentIndependentSqlClients -ne 2 -or
              $e.RotationWins -ne 1 -or
              $e.RotationDenials -ne 1 -or
              !$e.FamilyRevokedInSql -or
              !$e.SuccessorAccessRejected -or
              $e.FullPreprodGate -cne 'NOT_VERIFIED') {
            throw "APP-02B.3 independent SQL witness mismatch"
          }
          New-Item -ItemType Directory -Force TestResults | Out-Null
          Copy-Item $files[0].FullName TestResults/APP-02B3-SQL-WITNESS.json -Force
          $hash = (Get-FileHash -Path src/FmcgDms.Preprod.Identity/Migrations/20261117_001_identity_control_plane.sql -Algorithm SHA256).Hash
          @("SourceHeadSha=$env:APP02B3_SOURCE_HEAD_SHA",
            "WorkflowSha=$env:GITHUB_SHA",
            "TestRunId=$($e.TestRunId)",
            "MigrationScriptSha256=$hash",
            "Environment=GITHUB_HOSTED_WINDOWS_LOCALDB_NOT_PREPROD",
            "Result=SQL_SERVER_CI_ONLY") |
            Set-Content TestResults/APP-02B3-SQL-PROVENANCE.txt -Encoding utf8
      - name: Evidence (redacted SQL LocalDB CI only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app02b3-sql-localdb-ci-only
          path: |
            TestResults/APP-02B3-SQL-WITNESS.json
            TestResults/APP-02B3-SQL-PROVENANCE.txt
            tests/FmcgDms.Preprod.Identity.SqlServer.Tests/TestResults/
          if-no-files-found: warn

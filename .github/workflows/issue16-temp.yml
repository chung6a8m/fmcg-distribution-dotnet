# Temporary evidence/bootstrap workflow for Issue #16. Remove before PR review.
name: Issue 16 audit and lockfile bootstrap
on:
  push:
    branches: [fix/issue-16-workbox-glob]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Baseline npm audit (locked main snapshot)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-web"
          git show 1a747d8d9c9390de10b0ed3ccc28831b129c4eef:web/package.json > "$RUNNER_TEMP/baseline-web/package.json"
          git show 1a747d8d9c9390de10b0ed3ccc28831b129c4eef:web/package-lock.json > "$RUNNER_TEMP/baseline-web/package-lock.json"
          cd "$RUNNER_TEMP/baseline-web"
          npm audit --omit=dev --json > "$RUNNER_TEMP/issue16-before-prod.json" || true
          npm audit --json > "$RUNNER_TEMP/issue16-before-all.json" || true
      - name: Regenerate locked dependency tree
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reproducible install (Node 24)
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Dependency provenance and glob gate
        working-directory: web
        shell: bash
        run: |
          npm ls glob workbox-build vite-plugin-pwa --all
          node -e 'const l=require("./package-lock.json"); const x=Object.entries(l.packages).filter(([p])=>p.endsWith("node_modules/glob")); console.log("glob resolutions:",x.map(([p,v])=>p+"@"+v.version)); if(!x.length || x.some(([,v])=>v.version!=="14.0.6"))process.exit(1)'
      - name: Post-fix npm audits
        working-directory: web
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/issue16-after-prod.json" || true
          npm audit --json > "$RUNNER_TEMP/issue16-after-all.json" || true
      - name: Print audit summaries
        shell: bash
        run: |
          node -e 'const fs=require("node:fs");for(const key of ["before-prod","before-all","after-prod","after-all"]){const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/issue16-"+key+".json","utf8"));console.log(key,a.metadata?.vulnerabilities, Object.entries(a.vulnerabilities||{}).map(([name,v])=>name+":"+v.severity).join(", ")||"none")}'
      - name: Frontend 4/4 contract tests and TypeScript PWA build
        working-directory: web
        run: npm run test && npm run build
      - name: Check offline-first regression boundaries (artifact smoke)
        shell: bash
        run: |
          test -s web/dist/sw.js
          test -s web/dist/manifest.webmanifest
          grep -q "SKIP_WAITING" web/dist/sw.js
          if grep -Eq 'api/.*precache|precache.*api/' web/dist/sw.js; then exit 1; fi
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): regenerate Node 24 lockfile for patched glob (#16)"
            git push origin HEAD:fix/issue-16-workbox-glob
          fi
      - name: Upload audit JSON (baseline and post-fix)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue16-audit-evidence
          path: ${{ runner.temp }}/issue16-*.json
          if-no-files-found: warn

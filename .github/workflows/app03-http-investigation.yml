name: APP-03 HTTP investigation (diagnostic only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/app03-http-investigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-resume:
    name: APP-03 ${{ matrix.scenario }} / ${{ matrix.arm }} / iteration ${{ matrix.iteration }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [VerifyField, VerifySettlement]
        arm: [baseline, instrumented]
        iteration: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use runner temporary NuGet package directory
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'app00a-nuget-packages'
          "NUGET_PACKAGES=$packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'
      - name: Verify pinned SDK
        shell: pwsh
        run: |
          $actual = (dotnet --version).Trim()
          if ($actual -ne '10.0.404') { throw "Expected SDK 10.0.404, got $actual" }
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Verify Node.js 26 LTS
        shell: pwsh
        run: |
          $actual = (node --version).Trim()
          if ($actual -notmatch '^v26\.\d+\.\d+$') { throw "Expected Node.js >=26.13.1 <27, got $actual" }
          if ([version]$actual.Substring(1) -lt [version]'26.13.1') { throw "Node.js 26.13.1+ security baseline is required; got $actual" }
      - name: Start SQL Server LocalDB
        id: localdb
        shell: pwsh
        env:
          CI_LOCALDB_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/Initialize-LocalDb.ps1
      - name: Collect redacted LocalDB startup failure diagnostics
        if: always() && steps.localdb.outcome == 'failure'
        timeout-minutes: 1
        shell: pwsh
        env:
          LAB_E02_BOOTSTRAP: ${{ steps.localdb.outputs.bootstrap }}
          CI_LOCALDB_BOOTSTRAP_RECEIPT: ${{ steps.localdb.outputs.receipt }}
          LAB_E02_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/Collect-LocalDbDiagnostics.ps1
      - name: .NET restore
        run: dotnet restore FmcgDms.slnx
      - name: Build .NET solution
        run: dotnet build FmcgDms.slnx -c Release --no-restore
      - name: Enable same-job Demo build reuse
        shell: pwsh
        run: |
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the built checkout SHA.' }
          $sourceCommit = "$sourceCommit".Trim()
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Expected a full git commit SHA for the built checkout.' }
          $sourceStatus = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the built checkout is clean.' }
          if ($sourceStatus) { throw 'Cannot reuse the Demo build from a dirty checkout.' }
          "FMCG_CI_PREBUILT_SHA=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Verify APP-03 diagnostic boundaries
        run: node --test web/tests/app03-resume-proxy.test.mjs web/tests/app03-resume-vite.integration.test.mjs
      - name: Verify APP-03 SQL observer error classification
        shell: powershell
        run: ./tests/ci/Test-App03SqlReadErrors.ps1
      - name: Record diagnostic source, attempt and arm
        shell: pwsh
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SCENARIO: ${{ matrix.scenario }}
          ARM: ${{ matrix.arm }}
          ITERATION: ${{ matrix.iteration }}
        run: |
          $checkout = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Unexpected checkout.' }
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          $receipt = [ordered]@{
            schema = 'APP03_HTTP_COMPARISON_V1'; sourceHead = $env:SOURCE_HEAD; checkout = $checkout
            run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            scenario = $env:SCENARIO; arm = $env:ARM; iteration = [int]$env:ITERATION
            witnessEnabled = ($env:ARM -ceq 'instrumented')
            utc = [DateTime]::UtcNow.ToString('O')
          }
          $receipt | ConvertTo-Json | Set-Content TestResults/app03-http-comparison.json -Encoding utf8
          Write-Host "Diagnostic only: source=$env:SOURCE_HEAD checkout=$checkout run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT scenario=$env:SCENARIO arm=$env:ARM iteration=$env:ITERATION"
      - name: Execute original scenario once (does not substitute Full CI)
        id: scenario
        shell: pwsh
        env:
          SCENARIO: ${{ matrix.scenario }}
          FMCG_APP03_SETTLEMENT_WITNESS: ${{ matrix.arm == 'instrumented' && '1' || '0' }}
        run: |
          if ($env:SCENARIO -cnotin @('VerifyField', 'VerifySettlement')) { throw 'Unexpected scenario.' }
          ./scripts/Run-App03Dev.ps1 -Action $env:SCENARIO
      - name: Record outcome without replacing it
        if: always()
        shell: pwsh
        env:
          SCENARIO_OUTCOME: ${{ steps.scenario.outcome }}
        run: |
          if (Test-Path -LiteralPath TestResults/app03-http-comparison.json -PathType Leaf) {
            $receipt = Get-Content -LiteralPath TestResults/app03-http-comparison.json -Raw | ConvertFrom-Json
            $receipt | Add-Member -NotePropertyName scenarioOutcome -NotePropertyValue $env:SCENARIO_OUTCOME
            $receipt | Add-Member -NotePropertyName endedUtc -NotePropertyValue ([DateTime]::UtcNow.ToString('O'))
            $receipt | ConvertTo-Json | Set-Content TestResults/app03-http-comparison.json -Encoding utf8
          }
      - name: Preserve diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app03-http-investigation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}-${{ matrix.arm }}-${{ matrix.iteration }}
          path: |
            TestResults/app03-http-comparison.json
            TestResults/app03-5/
            TestResults/app03-6/
            web/test-results-app03-5/
            web/test-results-app03-6/
            TestResults/localdb*/
          if-no-files-found: warn

name: Security / picomatch GHSA-fc5q-39xc-vjpf (unwaived)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web-glob-input-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install exact lockfile for TypeScript AST verification
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Fail closed on unreviewed first-party glob input paths and mutations
        run: node --test web/tests/issue59-glob-boundary.test.mjs
  picomatch-lock-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install exact lockfile for approved developer-only dependency resolution
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Record installed picomatch tree for review
        working-directory: web
        run: npm ls picomatch --all
      - name: Fail closed on unapproved picomatch or expired conditional Owner decision
        run: node --test web/tests/picomatch-advisory.test.mjs

  full-npm-security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Reproduce lockfile exactly
        run: npm ci --no-audit --no-fund
      - name: Production-tree audit (all severities)
        run: npm audit --omit=dev --audit-level=low
      - name: Full-tree audit (moderate and above, no exclusion)
        run: npm audit --audit-level=moderate

  candidate-metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Query exact patched-fork registry provenance (no install)
        shell: bash
        run: |
          mkdir -p TestResults
          npm view '@ryotsu/picomatch@4.0.7-a' name version repository dist.integrity dist.tarball --json > TestResults/ryotsu-picomatch-metadata.json
          test -s TestResults/ryotsu-picomatch-metadata.json
          if npm view '@rootio/picomatch@4.0.7-root.io.1' name version repository dist.integrity dist.tarball --json > TestResults/rootio-picomatch-metadata.json; then
            echo 'RootPublicNpmAvailability=AVAILABLE' > TestResults/ROOT-STATUS.txt
          else
            echo 'RootPublicNpmAvailability=NOT_AVAILABLE_NO_INSTALL' > TestResults/ROOT-STATUS.txt
            rm -f TestResults/rootio-picomatch-metadata.json
          fi
          printf '%s\n' 'Candidate registry metadata only; PATCHED_SOURCE_NOT_REVIEWED' 'NO_LOCKFILE_CHANGE' 'FULL_NPM_AUDIT_STILL_REQUIRED' > TestResults/ACCEPTANCE-NOT-VERIFIED.txt
      - name: Upload candidate availability metadata (not signoff)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue59-candidate-registry-metadata-only
          path: TestResults/
          if-no-files-found: warn

  candidate-parse-source-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Fetch upstream and candidate tarballs without running lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults tmp/npm-pack tmp/upstream tmp/candidate
          official=$(npm pack 'picomatch@4.0.7' --ignore-scripts --silent --pack-destination tmp/npm-pack)
          candidate=$(npm pack '@ryotsu/picomatch@4.0.7-a' --ignore-scripts --silent --pack-destination tmp/npm-pack)
          tar -xzf "tmp/npm-pack/$official" -C tmp/upstream
          tar -xzf "tmp/npm-pack/$candidate" -C tmp/candidate
          test -f tmp/upstream/package/lib/parse.js
          test -f tmp/candidate/package/lib/parse.js
          sha256sum "tmp/npm-pack/$official" "tmp/npm-pack/$candidate" > TestResults/candidate-tarball-sha256.txt
          set +e
          diff -u tmp/upstream/package/lib/parse.js tmp/candidate/package/lib/parse.js > TestResults/parse-source.diff
          diff_exit=$?
          set -e
          if [ "$diff_exit" -gt 1 ]; then exit "$diff_exit"; fi
          if [ "$diff_exit" -eq 0 ]; then echo 'NO_PATCH_DIFF_FOUND' >&2; exit 1; fi
          echo 'CANDIDATE_SOURCE_DIFF_ONLY: PATCH_NOT_YET_INDEPENDENTLY_APPROVED'
          wc -l TestResults/parse-source.diff
          sed -n '1,160p' TestResults/parse-source.diff
          printf '%s\n' 'SOURCE_DIFF_REVIEW_PENDING' 'NO_NPM_OVERRIDE' 'FULL_NPM_AUDIT_REMAINS_SEPARATELY_REQUIRED' > TestResults/CANDIDATE-NOT-ACCEPTED.txt
      - name: Upload candidate patch diff for independent security review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue59-candidate-patch-source-diff-only
          path: TestResults/
          if-no-files-found: warn
